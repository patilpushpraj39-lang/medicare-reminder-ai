name: Deploy Medicare Reminder AI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          if [ -f "dist/client/index.html" ]; then
            cp dist/client/index.html dist/client/404.html
          elif [ -f "dist/client/_shell.html" ]; then
            cp dist/client/_shell.html dist/client/index.html
            cp dist/client/_shell.html dist/client/404.html
          else
            echo "No generated SPA HTML file found in dist/client"
            find dist -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
